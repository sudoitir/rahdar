name: OSV-Scanner

# Known vulnerabilities in every dependency manifest (ADR-0124, ADR-0171). Every finding goes to
# code scanning. Main and the weekly run fail on one that has a fixed version and warn on the rest,
# so a fixable CVE published against an existing dependency surfaces within a week and an unfixable
# one never blocks. Pull requests are scanned by ci.yml's `osv` job, behind the required `ci-ok`
# check, only when a manifest changed.
on:
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'web/package-lock.json'
      - 'site/package-lock.json'
      - 'examples/plugin-template/pom.xml'
      - '.github/workflows/osv-scanner.yml'
      - '.github/scripts/osv-gate*'
  schedule:
    - cron: "29 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      runs-on: ubuntu-26.04
      # Reporting is the reusable workflow's job; `gate` below decides what fails.
      fail-on-vuln: false
      # The application's manifest and the two lockfiles are what ships. The plugin template pins a
      # provided Rahdar at the oldest release a plugin may build against, so its tree describes that
      # release's codecs; scanning it would fail this run for codecs this build already overrides.
      scan-args: |-
        -L pom.xml
        -L web/package-lock.json
        -L site/package-lock.json

  gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan
        uses: google/osv-scanner-action/osv-scanner-action@d3c1414ded37de590f207572e37a7d180f1d0ef7 # v2.6.0
        env:
          GOTOOLCHAIN: auto
        # A scan with findings exits non-zero; the gate judges the results file.
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=results.json
            -L pom.xml
            -L web/package-lock.json
            -L site/package-lock.json
      - name: Fail on a finding that has a fix
        run: .github/scripts/osv-gate.sh results.json
