name: CI

# Pull requests carry the whole verification; main only releases (ADR-0126). The ruleset requires
# `ci-ok` on a branch that is up to date with main, so the merge commit is the commit CI tested.
# This file's name is load-bearing: npm trusted publishing is bound to `ci.yml`.
on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes a PR's run, but never main's: main's run is a release, which tags
# before it pushes the image, so cancelling it burns a version with nothing published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Persistent build cache, stored as a separate tag in the public Docker Hub repo.
# Anonymous pull works, so PR builds (no login) can still warm from it; only the
# release job writes it. Survives across runs without GHA's 10 GB eviction.
env:
  BUILDCACHE: sudoit1/rahdar:buildcache
  # Pinned: the changelog is a published artifact, not a best-effort render.
  GIT_CLIFF: git-cliff@2.13.1

jobs:
  # Which parts of the tree this push or PR touches (ADR-0088, ADR-0126). A push compares
  # against the commit before it, a PR against its base. Every later job keys off these outputs.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      plugin: ${{ steps.filter.outputs.plugin }}
      image: ${{ steps.filter.outputs.image }}
      release: ${{ steps.filter.outputs.release }}
      clients: ${{ steps.filter.outputs.clients }}
      site: ${{ steps.filter.outputs.site }}
      manifests: ${{ steps.filter.outputs.manifests }}
      workflows: ${{ steps.filter.outputs.workflows }}
      observability: ${{ steps.filter.outputs.observability }}
      hub: ${{ steps.filter.outputs.hub }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            ci: &ci
              - '.github/workflows/ci.yml'
            build: &build
              - 'src/**'
              - 'pom.xml'
              - 'mvnw'
              - '.mvn/**'
              - 'web/**'
              - 'Dockerfile'
              - '.dockerignore'
            backend:
              - *ci
              - 'src/**'
              - 'pom.xml'
              - 'mvnw'
              - '.mvn/**'
              # ObservabilityAssetsIntegrationTest reads the dashboards and rules.
              - 'deploy/observability/**'
            web:
              - *ci
              - 'web/**'
            # The plugin template and the SDK package: built and run against Rahdar (ADR-0102).
            plugin:
              - *ci
              - 'examples/plugin-template/**'
              - 'web/packages/**'
            # The PR image build: what the image is built from, or a change to how CI builds it.
            image:
              - *ci
              - *build
              # The HA reference stack the image is failed over in.
              - 'deploy/compose/**'
            # A release: only what the image is built from. A CI-only merge releases nothing.
            release:
              - *build
              - 'clients/**'
            # The generated Java client, built from web/openapi.json (ADR-0151).
            clients:
              - *ci
              - 'clients/**'
              - 'web/openapi.json'
            site:
              - *ci
              - 'site/**'
              - 'docs/**'
              - 'changelog/**'
              - 'web/public/favicon.svg'
            manifests:
              - *ci
              - 'pom.xml'
              - 'web/package-lock.json'
              - 'site/package-lock.json'
              - 'examples/plugin-template/pom.xml'
              - '.github/scripts/osv-gate*'
            workflows:
              - '.github/**'
            observability:
              - *ci
              - 'deploy/observability/**'
            hub:
              - 'docs/dockerhub.md'

  # ---------------------------------------------------------------------------------------------
  # Pull requests: every check in parallel, each only when its inputs changed.
  # ---------------------------------------------------------------------------------------------

  # Backend and frontend are coupled through the OpenAPI snapshot (web/openapi.json,
  # written by a backend test) and the schema generated from it, so a change on
  # either side runs both. The whole suite runs as three shards on separate runners against the
  # newest tested Artemis, and a fourth runner runs only the tests that start a real broker against
  # the oldest supported one (ADR-0142). BrokerVersionTest keeps the two images and
  # BrokerVersion.MINIMUM / LATEST_TESTED in step.
  backend:
    needs: changes
    if: >-
      github.event_name == 'pull_request'
      && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: "0", artemis: "apache/artemis:2.57.0" }
          - { shard: "1", artemis: "apache/artemis:2.57.0" }
          - { shard: "2", artemis: "apache/artemis:2.57.0" }
          - { shard: broker, artemis: "apache/activemq-artemis:2.33.0" }
    name: backend (${{ matrix.artemis }}, shard ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Round-robin over the sorted paths of every class Surefire would run by default, so each
      # shard gets a third and neighbouring heavy suites (Transfer*) land on different runners.
      # The `broker` shard is every class that starts a real broker (through ArtemisIntegrationTest
      # or ArtemisBrokers); nothing else depends on the broker's version.
      # The shard goes in as -Dtest, which replaces the pom's includes; an includesFile would be
      # appended to them and every shard would run the whole suite.
      # ponytail: count-balanced, not time-balanced; weigh by surefire report times if a shard lags.
      - name: Pick shard ${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          find src/test/java -type f \
            \( -name '*Test.java' -o -name '*Tests.java' -o -name 'Test*.java' -o -name '*TestCase.java' \) \
            | sort > "$RUNNER_TEMP/tests.txt"
          if [ "$SHARD" = broker ]; then
            xargs grep -l -e ArtemisIntegrationTest -e ArtemisBrokers < "$RUNNER_TEMP/tests.txt" > "$RUNNER_TEMP/picked.txt"
          else
            awk -v n=3 -v i="$SHARD" 'NR % n == i' "$RUNNER_TEMP/tests.txt" > "$RUNNER_TEMP/picked.txt"
          fi
          sed 's|^src/test/java/||; s|\.java$||; s|/|.|g' "$RUNNER_TEMP/picked.txt" > "$RUNNER_TEMP/shard.txt"
          echo "$(wc -l < "$RUNNER_TEMP/shard.txt") test classes in this shard"
      - name: Verify (Spotless check, Liquibase vs Testcontainers Postgres, tests)
        run: ./mvnw -B verify -Dtest="$(paste -sd, "$RUNNER_TEMP/shard.txt")" -Dsurefire.failIfNoSpecifiedTests=false -Dartemis.image="${{ matrix.artemis }}"
      - name: Fail on unformatted sources or a stale OpenAPI snapshot
        run: git diff --exit-code
      # This shard's coverage; the `coverage` job merges them all (ADR-0128).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-${{ strategy.job-index }}
          path: target/jacoco.exec
          retention-days: 7

  frontend:
    needs: changes
    if: >-
      github.event_name == 'pull_request'
      && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Fail on a stale generated API schema
        run: git diff --exit-code src/kernel/api/schema.d.ts
      # The published TypeScript client compiles against the schema just generated (ADR-0151).
      - name: Build the TypeScript client
        run: node packages/client/build.mjs 2026.01.0
      - run: npm run format:check
      - run: npm run lint
      # The browser project (ADR-0164): layout, contrast and focus where they happen.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:coverage
      - run: npm run test:browser
      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          total = json.load(open("coverage/coverage-summary.json"))["total"]
          print("### Frontend coverage\n\n| | Covered | |\n|---|---|---|")
          for k in ("lines", "branches", "functions", "statements"):
              print(f"| {k} | {total[k]['pct']}% | {total[k]['covered']} / {total[k]['total']} |")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-coverage
          path: web/coverage
          retention-days: 14

  # A break of the public API is refused unless a commit of the PR marks it (ADR-0149): oasdiff
  # compares web/openapi.json with the one where the branch left main, so only its own breaks count.
  # `just api-diff` runs the same script.
  api-compat:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tags, and origin/main for the PR's commits.
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/api-compat.sh origin/main

  # The Java client is generated from web/openapi.json, so a generator failure shows up here, not at
  # release (ADR-0151).
  client-java:
    needs: changes
    if: >-
      github.event_name == 'pull_request'
      && (needs.changes.outputs.web == 'true' || needs.changes.outputs.clients == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: clients/java/pom.xml
      - run: ./mvnw -B -f clients/java/pom.xml verify

  # The plugin kit, end to end (ADR-0102): build the template plugin against this Rahdar's API
  # jar and SDK, check it exactly as an upload would, then install, use, update, roll back and
  # remove it through a running Rahdar's API and UI.
  plugin-template:
    needs: changes
    if: >-
      github.event_name == 'pull_request'
      && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true'
      || needs.changes.outputs.plugin == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: rahdar
          POSTGRES_USER: rahdar
          POSTGRES_PASSWORD: rahdar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rahdar" --health-interval 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Rahdar (runnable jar with its UI; API jar into the local repository)
        run: ./mvnw -B -Pfrontend -DskipTests install

      - name: Pack the plugin SDK from this build
        working-directory: web
        run: |
          node packages/plugin-sdk/build.mjs 2026.01.0
          (cd packages/plugin-sdk/dist && npm pack)

      - name: Build the template as 1.0.0 and 1.0.1, signed with a throwaway key and checked as Rahdar will check it
        run: |
          set -euo pipefail
          SDK=$(ls "$GITHUB_WORKSPACE"/web/packages/plugin-sdk/dist/*.tgz)
          PLUGIN_SIGNING_STOREPASS="$(openssl rand -hex 16)"
          export PLUGIN_SIGNING_STOREPASS
          keytool -genkeypair -alias ci -keyalg EC -groupname secp256r1 -sigalg SHA256withECDSA -validity 2 \
            -dname "CN=Template CI" -keystore "$RUNNER_TEMP/ci.p12" -storetype PKCS12 \
            -storepass "$PLUGIN_SIGNING_STOREPASS" -keypass "$PLUGIN_SIGNING_STOREPASS"
          keytool -exportcert -rfc -alias ci -keystore "$RUNNER_TEMP/ci.p12" \
            -storepass "$PLUGIN_SIGNING_STOREPASS" -file "$RUNNER_TEMP/publisher.pem"
          for V in 1.0.0 1.0.1; do
            rm -rf "$RUNNER_TEMP/tpl" && cp -r examples/plugin-template "$RUNNER_TEMP/tpl"
            sed -i "0,/<version>1.0.0<\/version>/s//<version>$V<\/version>/" "$RUNNER_TEMP/tpl/pom.xml"
            ./mvnw -B -f "$RUNNER_TEMP/tpl/pom.xml" verify \
              -Drahdar.version=0.1.0-SNAPSHOT -Drahdar.since=2026.01.0 -Drahdar.sdk="$SDK" \
              -Dplugin.signing.keystore="$RUNNER_TEMP/ci.p12" -Dplugin.signing.alias=ci \
              -Drahdar.plugin.certificate="$RUNNER_TEMP/publisher.pem"
            cp "$RUNNER_TEMP/tpl/target/acme-notes-$V.jar" "$RUNNER_TEMP/"
          done

      - name: Start Rahdar
        run: |
          set -euo pipefail
          RAHDAR_DB_URL=jdbc:postgresql://localhost:5432/rahdar \
          RAHDAR_DB_USER=rahdar RAHDAR_DB_PASSWORD=rahdar \
          RAHDAR_SECRET_KEY="$(openssl rand -base64 32)" \
            nohup java -jar target/rahdar-exec.jar > "$RUNNER_TEMP/rahdar.log" 2>&1 &
          timeout 180 bash -c 'until curl -sf http://localhost:8080/actuator/health >/dev/null; do sleep 2; done'
          timeout 60 bash -c "until grep -q 'password:' '$RUNNER_TEMP/rahdar.log'; do sleep 1; done"
          echo "ADMIN_PASSWORD=$(awk '/password:/ {print $2; exit}' "$RUNNER_TEMP/rahdar.log")" >> "$GITHUB_ENV"

      - name: Install, use, update, roll back and remove the plugin
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          RAHDAR=http://localhost:8080 NEW_PASSWORD="ci-$(openssl rand -hex 12)" \
          JAR_V1="$RUNNER_TEMP/acme-notes-1.0.0.jar" JAR_V2="$RUNNER_TEMP/acme-notes-1.0.1.jar" \
          PUBLISHER_CERT="$RUNNER_TEMP/publisher.pem" \
            node --experimental-strip-types scripts/plugin-e2e.ts

      - name: Rahdar's log
        if: failure()
        run: tail -300 "$RUNNER_TEMP/rahdar.log"

  # The Dockerfile still builds, and two replicas of the image built here survive a kill and a rolling stop
  # (ADR-0152). Single-arch, no push, in parallel with the tests.
  image:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.image == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # `just ha-failover` runs the same stack and script.
      COMPOSE: docker compose -p rahdar-ha-test --env-file deploy/compose/dev/ha/test.env -f deploy/compose/compose.ha.yaml -f deploy/compose/dev/compose.ha.test.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: rahdar:ci
          # Warm from the release job's registry cache (anonymous pull); keep a
          # per-branch GHA layer so successive PR pushes stay incremental.
          cache-from: |
            type=registry,ref=${{ env.BUILDCACHE }}
            type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # Two replicas behind HAProxy, one broker and Postgres, on the image just built: SIGKILL the owner of a
      # cluster under load, then stop the other replica gracefully. No request fails in the second, no event is
      # lost in either, and scraping resumes (web/scripts/ha-failover.ts).
      - name: Throwaway secrets for the failover stack
        run: |
          db_password="$(openssl rand -hex 16)"
          secret_key="$(openssl rand -base64 32)"
          echo "::add-mask::$db_password"
          echo "::add-mask::$secret_key"
          {
            echo "DB_PASSWORD=$db_password"
            echo "SECRET_KEY=$secret_key"
          } >> "$GITHUB_ENV"
      - name: Fail over between two replicas
        run: |
          $COMPOSE up -d --wait --wait-timeout 300
          node --experimental-strip-types web/scripts/ha-failover.ts
      - name: The replicas' logs
        if: failure()
        run: $COMPOSE logs --tail 300 rahdar-1 rahdar-2 lb
      - name: Remove the failover stack
        if: always()
        run: $COMPOSE down -v
      # Grype, pinned by digest like actionlint (ADR-0139). The first run reports every finding,
      # fixed or not; the second fails on a fixable high or critical and names the fixed version.
      - name: Scan the image
        run: |
          mkdir -p "$RUNNER_TEMP/grype"
          grype() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/grype:/cache" -e GRYPE_DB_CACHE_DIR=/cache \
              anchore/grype:v0.119.0@sha256:8c2c9234a345577a6d321a4753aa3ee1276d8975c8452d2344a56b57733ecad3 \
              rahdar:ci "$@"
          }
          echo "Every finding:"; grype
          echo "Fixable findings (fails on high or critical):"; grype --only-fixed --fail-on high

  # The documentation site builds (ADR-0061 D5). pages.yml deploys it from main.
  site:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.site == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `lastUpdated` reads each page's git commit time.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # A pull request fails when it introduces a known vulnerability that has a fixed version
  # (ADR-0124, ADR-0171); `osv-gate` decides. osv-scanner.yml scans main and the whole tree weekly.
  osv:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.manifests == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      runs-on: ubuntu-26.04
      # Reporting is the reusable workflow's job; `osv-gate` decides what fails.
      fail-on-vuln: false
      scan-args: |-
        -L pom.xml
        -L web/package-lock.json
        -L site/package-lock.json
        -L examples/plugin-template/pom.xml

  osv-gate:
    needs: [changes, osv]
    if: github.event_name == 'pull_request' && needs.changes.outputs.manifests == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The scan results the reusable workflow uploads for the base and for the PR.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-json-results'
          path: osv
      - name: Test the gate
        run: bash .github/scripts/osv-gate.test.sh
      - name: Fail on an introduced vulnerability that has a fix
        run: .github/scripts/osv-gate.sh osv/new-json-results/new-results.json osv/old-json-results/old-results.json

  actionlint:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The released image, pinned by digest: nothing is downloaded and run unverified.
      - name: Lint the workflows
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  # Rahdar builds on released OpenBroker artifacts only (ADR-0203). A -SNAPSHOT exists only in the
  # ~/.m2 of whoever built it, so a pull request that pins one could never be built again from main.
  openbroker-release:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The broker SDK is a released version
        run: |
          version=$(sed -n 's:.*<openbroker.version>\(.*\)</openbroker.version>.*:\1:p' pom.xml)
          echo "openbroker.version is $version"
          if [ -z "$version" ]; then
            echo "::error file=pom.xml::No <openbroker.version> property in pom.xml."
            exit 1
          fi
          case "$version" in
            *-SNAPSHOT)
              echo "::error file=pom.xml::openbroker.version is $version. Release OpenBroker and pin that version: a SNAPSHOT is not on Maven Central, so main could not be built from it."
              exit 1
              ;;
          esac

  # The shipped alert rules are valid and the dashboard is JSON. That their metric names exist is
  # ObservabilityAssetsIntegrationTest, in the backend job.
  observability:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the alert rules and the dashboard
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/observability/prometheus:/rules:ro" \
            prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 \
            check rules /rules/rahdar-alerts.yml
          jq empty deploy/observability/grafana/rahdar-overview.json

  # The backend shards' coverage as one report: merged with the JaCoCo CLI (resolved through Maven,
  # so its checksum is verified) against the compiled classes. Informational (ADR-0128).
  coverage:
    needs: backend
    if: needs.backend.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jacoco-*
          path: ${{ runner.temp }}/jacoco
      - name: Merge the shards and write the report
        run: |
          set -euo pipefail
          ./mvnw -B -q compile -Dspotless.apply.skip
          ./mvnw -B -q dependency:copy -Dartifact=org.jacoco:org.jacoco.cli:0.8.15:jar:nodeps \
            -DoutputDirectory="$RUNNER_TEMP" -Dmdep.stripVersion=true
          CLI="java -jar $RUNNER_TEMP/org.jacoco.cli-nodeps.jar"
          $CLI merge "$RUNNER_TEMP"/jacoco/*/jacoco.exec --destfile target/jacoco.exec
          mkdir -p target/site/jacoco
          $CLI report target/jacoco.exec --classfiles target/classes --sourcefiles src/main/java \
            --html target/site/jacoco --csv target/site/jacoco/jacoco.csv --xml target/site/jacoco/jacoco.xml \
            --name "Rahdar"
      - name: Coverage summary
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import csv
          rows = list(csv.DictReader(open("target/site/jacoco/jacoco.csv")))
          def pct(kind):
              c = sum(int(r[f"{kind}_COVERED"]) for r in rows)
              m = sum(int(r[f"{kind}_MISSED"]) for r in rows)
              return f"| {kind.lower()} | {100 * c / (c + m):.1f}% | {c} / {c + m} |"
          print("### Backend coverage\n\n| | Covered | |\n|---|---|---|")
          print("\n".join(pct(k) for k in ("LINE", "BRANCH", "METHOD", "INSTRUCTION")))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: target/site/jacoco
          retention-days: 14

  # SonarQube Cloud (ADR-0140): a PR is analysed with the coverage its own backend and frontend jobs
  # just measured, and its quality gate is required through `ci-ok`. Main does not re-test
  # (ADR-0126), so its analysis reuses the coverage of the PR run that the merge commit came from,
  # which keeps the main dashboard and the README badges current. Fork PRs get no token and skip;
  # so do Dependabot PRs (ADR-0155): their runs get Dependabot secrets, not SONAR_TOKEN, and they
  # change only manifests, which the analysis of the main push after the merge covers.
  sonar:
    needs: [changes, coverage, frontend]
    if: >-
      !cancelled() && (
        (github.event_name == 'push'
          && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true'))
        || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && needs.coverage.result == 'success' && needs.frontend.result == 'success'))
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # blame and new-code detection need the history
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Coverage of this PR
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-coverage
          path: target/site/jacoco
      - name: Frontend coverage of this PR
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: web/coverage
      - name: Coverage of the PR this merge came from
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0].number')
          head=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event pull_request \
            --commit "$head" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "Coverage from PR #$pr, run $run"
          gh run download "$run" --repo "$GITHUB_REPOSITORY" -n backend-coverage -D target/site/jacoco
          gh run download "$run" --repo "$GITHUB_REPOSITORY" -n frontend-coverage -D web/coverage
      - run: npm ci
        working-directory: web
      - name: Analyse
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          ./mvnw -B -DskipTests -Dspotless.apply.skip test-compile sonar:sonar
          -Dsonar.qualitygate.wait=true

  # The one required status check. A job skipped by its path filter counts as passed; a failed
  # or cancelled one does not. Requiring this instead of each job keeps path filtering safe.
  ci-ok:
    if: always()
    needs: [changes, backend, coverage, frontend, sonar, api-compat, client-java, plugin-template, image, site, osv, osv-gate, actionlint, observability, openbroker-release]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every required job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "CI is green."

  # ---------------------------------------------------------------------------------------------
  # Main: no re-test. Release what the merge changed, and only that.
  # ---------------------------------------------------------------------------------------------

  # A push to main that changes what the image is built from cuts a CalVer release.
  # A docs- or CI-only push releases nothing; its commits land in the next release's
  # notes. See .claude/rules/10-release.md, ADR-0088 and ADR-0126.
  release:
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: write
      # To rebuild the site's changelog once the release exists (ADR-0129).
      actions: write
      # Keyless attestations of the image and the jar (ADR-0139).
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      # The release tags the merge commit and commits nothing, so main never moves and no
      # open pull request falls behind because of a release (ADR-0129).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Version = date + one past the highest PATCH already tagged this month.
      # Only tags matching the canonical CalVer shape are candidates, so a stray
      # or hand-made tag can neither be parsed as a PATCH nor shift the counter.
      - name: Compute CalVer version
        id: ver
        run: |
          set -euo pipefail
          BASE=$(date -u +%Y.%m)
          LAST=$(git tag -l "$BASE.*" | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$LAST" ]; then PATCH=0; else PATCH=$(( ${LAST##*.} + 1 )); fi
          VERSION="$BASE.$PATCH"
          echo "$VERSION" | grep -qE '^[0-9]{4}\.[0-9]{2}\.[0-9]+$' \
            || { echo "::error::computed version '$VERSION' is not CalVer"; exit 1; }
          # A version tag is published to Docker Hub immutably, so it must never be
          # reused. The local tag list can be stale; the remote is the authority.
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::tag $VERSION already exists on origin — refusing to republish"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "month=$BASE"
            echo "date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"
          echo "→ releasing $VERSION"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set project version and build the jar
        run: |
          ./mvnw -B versions:set -DnewVersion="${{ steps.ver.outputs.version }}" -DgenerateBackupPoms=false
          ./mvnw -B -Pfrontend -DskipTests package

      - name: Stage release assets
        run: |
          V=${{ steps.ver.outputs.version }}
          cp target/rahdar-exec.jar "rahdar-$V.jar"
          sha256sum "rahdar-$V.jar" > "rahdar-$V.jar.sha256"
          # The Grafana dashboard and Prometheus rules, as their own asset (ADR-0147).
          tar -czf "rahdar-observability-$V.tar.gz" deploy/observability
          sha256sum "rahdar-observability-$V.tar.gz" > "rahdar-observability-$V.tar.gz.sha256"
          # The API document of this release, with the release as its version (ADR-0151).
          jq --arg v "$V" '.info.version = $v' web/openapi.json > "rahdar-$V.openapi.json"
          sha256sum "rahdar-$V.openapi.json" > "rahdar-$V.openapi.json.sha256"

      # Signed SLSA provenance and a CycloneDX SBOM for the jar, verifiable with
      # `gh attestation verify` and no key of ours (ADR-0139). The bundle is a release asset too.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: rahdar-${{ steps.ver.outputs.version }}.jar
          format: cyclonedx-json
          output-file: rahdar-${{ steps.ver.outputs.version }}.jar.cdx.json
          upload-artifact: false
      - name: Attest the jar's provenance
        id: jar-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: rahdar-${{ steps.ver.outputs.version }}.jar
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: rahdar-${{ steps.ver.outputs.version }}.jar
          sbom-path: rahdar-${{ steps.ver.outputs.version }}.jar.cdx.json
      - name: Stage the jar's provenance bundle
        run: cp "${{ steps.jar-provenance.outputs.bundle-path }}" "rahdar-${{ steps.ver.outputs.version }}.jar.intoto.jsonl"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: rahdar-${{ steps.ver.outputs.version }}.openapi.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The release notes are generated from the commit messages since the previous tag and
      # become the GitHub release body, their one home (ADR-0051, ADR-0129).
      - name: Write the release notes
        run: |
          set -euo pipefail
          V=${{ steps.ver.outputs.version }}
          npx -y "$GIT_CLIFF" --config cliff.toml --unreleased --tag "$V" -o "$RUNNER_TEMP/cliff.md"
          python3 scripts/release-notes.py "$RUNNER_TEMP/cliff.md" release-notes.md
          echo "→ release body:"; cat release-notes.md

      # Reserve the version BEFORE anything immutable is published. If the image push were
      # first and this step then failed, the next run would compute the same version and
      # overwrite an already-published Docker Hub tag. Burning a version number on a later
      # failure is the cheaper outcome. Only the tag is pushed: tags are outside the main
      # ruleset, and the tagged commit is the merge commit CI verified.
      - name: Tag the release
        run: |
          set -euo pipefail
          V=${{ steps.ver.outputs.version }}
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$V" -m "Release $V" "${{ github.sha }}"
          git push origin "refs/tags/$V"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # Buildkit's own attestations add `unknown/unknown` entries that clutter the Docker Hub
          # tag view. The image is attested below instead, as OCI referrers (ADR-0139).
          provenance: false
          sbom: false
          # Registry cache: not size-capped like GHA, shared across every run and
          # readable by PR builds. mode=max caches the web/maven build stages too.
          cache-from: |
            type=registry,ref=${{ env.BUILDCACHE }}
            type=gha
          cache-to: type=registry,ref=${{ env.BUILDCACHE }},mode=max,image-manifest=true,oci-mediatypes=true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rahdar:${{ steps.ver.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rahdar:${{ steps.ver.outputs.month }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rahdar:dev
          labels: |
            org.opencontainers.image.title=Rahdar
            org.opencontainers.image.description=Cluster-wide management and observability for Apache ActiveMQ Artemis
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.ver.outputs.date }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      # Provenance and a CycloneDX SBOM for the image, signed and stored next to it on Docker Hub.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/rahdar@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: rahdar-${{ steps.ver.outputs.version }}.image.cdx.json
          upload-artifact: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/rahdar
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/rahdar
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: rahdar-${{ steps.ver.outputs.version }}.image.cdx.json
          push-to-registry: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          prerelease: true
          files: |
            rahdar-${{ steps.ver.outputs.version }}.jar
            rahdar-${{ steps.ver.outputs.version }}.jar.sha256
            rahdar-observability-${{ steps.ver.outputs.version }}.tar.gz
            rahdar-observability-${{ steps.ver.outputs.version }}.tar.gz.sha256
            rahdar-${{ steps.ver.outputs.version }}.openapi.json
            rahdar-${{ steps.ver.outputs.version }}.openapi.json.sha256
            rahdar-${{ steps.ver.outputs.version }}.jar.intoto.jsonl
            rahdar-${{ steps.ver.outputs.version }}.jar.cdx.json
            rahdar-${{ steps.ver.outputs.version }}.image.cdx.json

      # What users run (site/src/guide/verify-releases.md): if it fails here, the release fails.
      - name: Verify the attestations as a user would
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/rahdar
        run: |
          set -euo pipefail
          V=${{ steps.ver.outputs.version }}
          SIGNER=(--repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml")
          gh attestation verify "rahdar-$V.jar" "${SIGNER[@]}"
          gh attestation verify "rahdar-$V.jar" "${SIGNER[@]}" --predicate-type https://cyclonedx.org/bom
          gh attestation verify "rahdar-$V.openapi.json" "${SIGNER[@]}"
          gh attestation verify "oci://docker.io/$IMAGE:$V" "${SIGNER[@]}"
          gh attestation verify "oci://docker.io/$IMAGE:$V" "${SIGNER[@]}" --predicate-type https://cyclonedx.org/bom
          # Docker Hub lists a freshly pushed referrer only after a delay, which has run past a
          # minute, so give it five.
          for i in {1..30}; do
            gh attestation verify "oci://docker.io/$IMAGE:$V" "${SIGNER[@]}" --bundle-from-oci && break
            [ "$i" -lt 30 ] || exit 1
            sleep 10
          done

      # A release made with the workflow token triggers no workflow, so the site that lists the
      # release notes is rebuilt explicitly.
      - name: Rebuild the site's changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

  # The Docker Hub landing page, whenever its source changes; no release needed for that. The
  # credential needs read, write AND delete scope: the description API rejects a repo-scoped PAT.
  hub-description:
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.hub == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/rahdar
          # Its own file, not README.md: the repository landing page carries
          # contributing notes and a trademark section that mean nothing to
          # someone reading a tag list.
          readme-filepath: docs/dockerhub.md
          short-description: Cluster-wide management and observability for Apache ActiveMQ Artemis
          # Docker Hub does not resolve repo-relative paths, so without this the
          # screenshots render broken even when the push succeeds.
          enable-url-completion: true

  # The plugin API on Maven Central (ADR-0102): the plain jar of the release just tagged, with its
  # sources and javadoc, signed. Only when the backend changed since the newest version on Central
  # (ADR-0126), so a UI-only release publishes nothing here and a failed publish is retried by the
  # next release. japicmp refuses an incompatible change to @PluginApi types first, unless this
  # release raised Contract.VERSION: that is a deliberate break (ADR-0102, ADR-0112).
  publish-api:
    needs: release
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Keyless provenance for the files deployed to Central (ADR-0139).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.version }}
          # Every tag: the last published version and the contract of the release before this one.
          fetch-depth: 0
          persist-credentials: false
      - name: Did the backend change since the newest version on Central?
        id: needed
        run: |
          V="${{ needs.release.outputs.version }}"
          LAST=$(curl -sf https://repo1.maven.org/maven2/io/github/sudoitir/rahdar/maven-metadata.xml \
            | sed -n 's:.*<release>\(.*\)</release>.*:\1:p' || true)
          if [ -n "$LAST" ] && git rev-parse -q --verify "refs/tags/$LAST" >/dev/null \
            && git diff --quiet "$LAST" "$V" -- src/main pom.xml; then
            echo "Backend unchanged since $LAST on Central: nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Backend changed since ${LAST:-nothing on Central}: publishing $V."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
      # japicmp compares with the newest version on Central (`RELEASE`), so the contract is compared with
      # that version too, not with the previous tag: after a publish that failed, the previous tag may
      # already carry the raised contract while Central still has the old one.
      - name: Compare the contract version with the newest on Central
        id: contract
        if: steps.needed.outputs.publish == 'true'
        env:
          LAST: ${{ steps.needed.outputs.last }}
        run: |
          V="${{ needs.release.outputs.version }}"
          if [ -n "$LAST" ] && git rev-parse -q --verify "refs/tags/$LAST" >/dev/null; then
            PREV="$LAST"
          else
            PREV=$(git tag -l | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]+$' | sort -V | awk -v v="$V" '$0 == v { print p; exit } { p = $0 }')
          fi
          FILE=src/main/java/io/github/sudoitir/rahdar/kernel/plugin/Contract.java
          contract() { git show "$1:$FILE" | sed -n 's/.*int VERSION = \([0-9]*\);.*/\1/p'; }
          NOW=$(contract "$V")
          [ -n "$NOW" ] || { echo "::error::no Contract.VERSION in $FILE at $V"; exit 1; }
          BEFORE=$([ -n "$PREV" ] && contract "$PREV" || true)
          if [ -n "$BEFORE" ] && [ "$NOW" != "$BEFORE" ]; then
            echo "Contract $BEFORE -> $NOW since $PREV: a deliberate API break, so japicmp is skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Contract $NOW, unchanged since ${PREV:-the first release}: japicmp checks the API."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the publishing secrets are set
        if: steps.needed.outputs.publish == 'true'
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          missing=0
          for name in SONATYPE_USERNAME SONATYPE_PASSWORD GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then echo "::error::repository secret $name is not set"; missing=1; fi
          done
          exit $missing
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.needed.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: "25"
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
      - name: Publish io.github.sudoitir:rahdar:${{ needs.release.outputs.version }}
        if: steps.needed.outputs.publish == 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./mvnw -B versions:set -DnewVersion="${{ needs.release.outputs.version }}" -DgenerateBackupPoms=false
          ./mvnw -B -Prelease,api-check -DskipTests -Dspring-boot.repackage.skip=true -Dgpg.signer=bc \
            -Djapicmp.skip=${{ steps.contract.outputs.skip }} deploy
      # The bytes Central serves: the plain, sources and javadoc jars and the pom.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: steps.needed.outputs.publish == 'true'
        with:
          subject-path: |
            target/rahdar*.jar
            pom.xml

  # The plugin SDK on npm (ADR-0102), versioned like Rahdar (2026.09.0 is npm 2026.9.0). Only when
  # what the SDK is built from changed since the newest version on npm (ADR-0126). Trusted
  # publishing through GitHub's OIDC: npmjs.com trusts this workflow file, so no npm token is stored.
  publish-sdk:
    needs: release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Did the SDK's inputs change since the newest version on npm?
        id: needed
        run: |
          V="${{ needs.release.outputs.version }}"
          NPM=$(npm view @rahdar/plugin-sdk version 2>/dev/null || true)
          # npm drops the month's leading zero: 2026.9.3 is the tag 2026.09.3.
          LAST=$([ -n "$NPM" ] && echo "$NPM" | awk -F. '{ printf "%d.%02d.%d", $1, $2, $3 }' || true)
          if [ -n "$LAST" ] && git rev-parse -q --verify "refs/tags/$LAST" >/dev/null \
            && git diff --quiet "$LAST" "$V" -- web/packages web/src/sdk web/src/kernel web/package.json web/package-lock.json; then
            echo "SDK unchanged since $LAST on npm: nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "SDK changed since ${LAST:-nothing on npm}: publishing $V."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build @rahdar/plugin-sdk
        if: steps.needed.outputs.publish == 'true'
        working-directory: web
        run: |
          npm ci
          node packages/plugin-sdk/build.mjs "${{ needs.release.outputs.version }}"
      - name: Publish
        if: steps.needed.outputs.publish == 'true'
        working-directory: web/packages/plugin-sdk/dist
        # Trusted publishing (OIDC) needs npm 11.5.1 or later.
        run: |
          npx -y semver@7 -r '>=11.5.1' "$(npm -v)" >/dev/null || { echo "npm $(npm -v) is too old to publish"; exit 1; }
          npm publish --access public --provenance

  # The TypeScript client on npm (ADR-0151), versioned like Rahdar (2026.09.0 is npm 2026.9.0) and
  # built from the release's own OpenAPI document, so every release publishes one. Trusted
  # publishing through GitHub's OIDC, as for the SDK; the package's trusted publisher is set up once
  # on npmjs.com (workflow ci.yml, no environment).
  publish-client-ts:
    needs: release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.version }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Build @rahdar/client
        working-directory: web
        run: |
          npm ci
          node packages/client/build.mjs "${{ needs.release.outputs.version }}"
      - name: Publish
        working-directory: web/packages/client/dist
        run: |
          npx -y semver@7 -r '>=11.5.1' "$(npm -v)" >/dev/null || { echo "npm $(npm -v) is too old to publish"; exit 1; }
          npm publish --access public --provenance

  # The Java client on Maven Central (ADR-0151): generated from the release's OpenAPI document, so
  # every release publishes one, signed and attested like the plugin API.
  publish-client-java:
    needs: release
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.version }}
          persist-credentials: false
      - name: Check the publishing secrets are set
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          missing=0
          for name in SONATYPE_USERNAME SONATYPE_PASSWORD GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then echo "::error::repository secret $name is not set"; missing=1; fi
          done
          exit $missing
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
      - name: Publish io.github.sudoitir:rahdar-client:${{ needs.release.outputs.version }}
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./mvnw -B -f clients/java/pom.xml versions:set -DnewVersion="${{ needs.release.outputs.version }}" -DgenerateBackupPoms=false
          ./mvnw -B -f clients/java/pom.xml -Prelease -Dgpg.signer=bc deploy
      # The bytes Central serves: the jar, its sources and javadoc, and the pom.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            clients/java/target/rahdar-client*.jar
            clients/java/pom.xml
