version: 2

# Safe posture:
#  * Weekly, grouped, so updates land as a few reviewable PRs, not a flood.
#  * Minor + patch are grouped and auto-raised; every PR still runs full CI
#    (Spotless check, Liquibase vs Testcontainers Postgres, tests, web build,
#    image build) — nothing merges without that passing.
#  * A cooldown lets a fresh release settle before a version update proposes it;
#    security updates ignore the cooldown and arrive as soon as an advisory does.
#  * MAJOR bumps of the framework-defining dependencies are ignored here, so
#    moving Spring Boot, React, Vite, Mantine, or the DB driver across a major
#    is always a deliberate, human-authored change (and usually an ADR).
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 14
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    commit-message:
      prefix: "build(deps)"
    groups:
      # The broker SDK's modules are released together and must move together.
      openbroker:
        patterns: ["io.github.sudoitir:openbroker-*"]
      maven-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Maven 3.10's resolver writes maven-metadata-local.xml and _remote.repositories into
      # central-publishing-maven-plugin's staging repository (0.11.0, the newest), and Maven Central
      # refuses the bundle. Stay on 3.9 until the plugin handles it.
      - dependency-name: "org.apache.maven:apache-maven"
        versions: [">= 3.10.0"]
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.postgresql:postgresql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.liquibase:*"
        update-types: ["version-update:semver-major"]
      # Pinned to the version the Spring Boot BOM's OpenTelemetry SDK or Spring Security's
      # webauthn4j-core uses; they move with Boot and Spring Security, never alone.
      - dependency-name: "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0"
      - dependency-name: "com.webauthn4j:webauthn4j-test"

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 14
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    versioning-strategy: increase
    commit-message:
      prefix: "build(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mantine/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # vitest 5.0.1's jsdom environment reads Blob's private `_buffer`, which jsdom 30.1.0 renamed
      # to `_bytes`: every test sending a File body fails. Drop this once vitest reads `_bytes`.
      - dependency-name: "jsdom"
        versions: [">= 30.1.0"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      # Node moves LTS to LTS on purpose (CI, the poms and this image together); odd majors never ship.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: ["dependencies"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  # Not the plugin template: it pins the versions Rahdar runs a plugin on, so it moves with
  # Rahdar's own pom and SDK, never on its own.
  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 14
    labels: ["dependencies"]
    commit-message:
      prefix: "docs(deps)"
    groups:
      site-npm:
        patterns: ["*"]
