# The broker client is wired by OpenBroker's starter (ADR-0211, ADR-0212).
openbroker:
  tracing:
    # Rahdar moves messages that producers wrote; it never adds a trace header to one.
    inject-context: false
  spring-connections:
    # Clusters are registered at runtime, never derived from spring.kafka or spring.artemis.
    enabled: false
  client:
    # Large bodies spool here while a relay or a drain holds them; the gateway sweeps it at start.
    spool-directory: ${java.io.tmpdir}/rahdar-spool

spring:
  application:
    name: rahdar

  lifecycle:
    # Each shutdown phase (ShutdownPhases) gets this long; the web server's graceful shutdown and the
    # drain wait share it with the other steps.
    timeout-per-shutdown-phase: 30s

  modulith:
    # Only packages with an @ApplicationModule package-info are modules (ADR-0069):
    # kernel.*, platform.* and feature.* each declare one. ModularityTest reads
    # this file too — Modulith loads it through Boot's config data loader.
    detection-strategy: explicitly-annotated

  datasource:
    url: ${RAHDAR_DB_URL:jdbc:postgresql://localhost:5432/rahdar}
    username: ${RAHDAR_DB_USER:rahdar}
    password: ${RAHDAR_DB_PASSWORD:rahdar}
    # Connections are bounded in count and time, and nothing here relies on a server-side setting
    # (ADR-0195). The pool is per replica: replicas x (pool + 1 listener) + plugin pools + the
    # read pool must stay under the server's max_connections.
    hikari:
      maximum-pool-size: ${RAHDAR_DB_POOL_SIZE:16}
      minimum-idle: ${RAHDAR_DB_POOL_SIZE:16}
      # Milliseconds. With virtual threads a long wait only piles up threads, so a request fails fast
      # instead (5 s wait; connections live 30 min, are probed every 2 min; a lease past 2 min is logged).
      connection-timeout: 5000
      max-lifetime: 1800000
      keepalive-time: 120000
      leak-detection-threshold: 120000
      # Session settings, so they hold on any server, through a session-mode pooler and after a
      # failover (a new connection runs this again). Work that is legitimately longer raises the
      # statement timeout for its own transaction with SET LOCAL (StatementTimeout).
      connection-init-sql: >-
        SET statement_timeout = '30s';
        SET lock_timeout = '5s';
        SET idle_in_transaction_session_timeout = '60s'
      data-source-properties:
        # Seconds. A black-holed network fails the connect fast; the socket timeout is above the
        # longest SET LOCAL statement timeout (10 min) so only a dead peer trips it.
        connectTimeout: 5
        socketTimeout: 900
        tcpKeepAlive: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  session:
    jdbc:
      # Liquibase owns this schema (db/changelog/kernel/security/changes/0001-baseline.sql),
      # not the library's own initializer (ADR-0011).
      initialize-schema: never
      table-name: spring_session
      # The data lifecycle purges expired sessions once per installation (expired-sessions
      # store, ADR-0134); "-" turns off Spring Session's own cleanup, which every instance ran.
      cleanup-cron: "-"

  # OIDC/SSO (ADR-0040) is opt-in: with no `spring.security.oauth2.client.registration.*`
  # entry configured, Spring Boot's OAuth2 client auto-configuration backs off
  # entirely and only local login is available. Uncomment and fill in to enable
  # it — never commit a real client-secret; source it from the environment.
  #
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         rahdar:
  #           client-id: ${RAHDAR_OIDC_CLIENT_ID:}
  #           client-secret: ${RAHDAR_OIDC_CLIENT_SECRET:}
  #           scope: openid,profile,email,groups
  #       provider:
  #         rahdar:
  #           issuer-uri: ${RAHDAR_OIDC_ISSUER_URI:}

  jpa:
    # Liquibase owns the schema; Hibernate only maps to it and checks the mapping
    # on startup. Never let Hibernate touch DDL.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  threads:
    virtual:
      enabled: true

  ai:
    mcp:
      server:
        # The MCP surface is an optional module (ADR-0069): with
        # rahdar.features.mcp.enabled=false there is no server, no /mcp
        # endpoint and no annotation scanning of the tool beans.
        enabled: ${rahdar.features.mcp.enabled:true}
        name: rahdar
        version: 1.0.0
        # SYNC is load-bearing, not a preference (ADR-0045). The tool body must stay
        # on the servlet thread: PermissionResolver reads SecurityContextHolder and
        # ActorResolver reads RequestContextHolder, both ThreadLocal. Under ASYNC the
        # work moves to a Reactor scheduler, the context is empty, and every tool
        # answers "no cluster visible" — a config mistake that presents as a
        # permissions bug. McpAuthorizationIntegrationTest is the regression guard.
        type: SYNC
        # No session map, no sticky routing, compatible with multi-instance HA. Also
        # sidesteps the unbounded-session class of problem behind CVE-2026-59279 in
        # 2.0.0's STREAMABLE transport, which is why the pom pins 2.0.1.
        protocol: STATELESS
        annotation-scanner:
          enabled: ${rahdar.features.mcp.enabled:true}
        capabilities:
          # Declaring a capability we do not implement is worse than not having it.
          # There is no @McpComplete anywhere in the surface.
          completion: false
        # The instructions block is NOT written here. McpGate generates it per caller
        # from McpToolCatalog (ADR-0054, ADR-0137) — the hand-written one
        # that used to live here had already drifted, omitting two tools, which told
        # a tool-searching host that two capabilities did not exist.

springdoc:
  paths-to-exclude: /api/v1/p/**,/api/v1/clusters/*/p/**

server:
  port: ${RAHDAR_PORT:8080}
  # Tomcat's RemoteIpValve, not Spring's ForwardedHeaderFilter: only a peer matching
  # internal-proxies may set the client address (X-Forwarded-For) and scheme; the sign-in
  # throttle, the audit trail and session facts all use the resolved address, so a client
  # that is not a trusted proxy cannot forge its way past the throttle (ADR-0144).
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Java regex matched against the peer's address. The default trusts loopback and the
      # private ranges 10/8, 172.16/12, 192.168/16 and fc00::/7. Behind a proxy outside them,
      # override with SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES (a regex covering only your
      # proxies); never leave it empty, which trusts every peer.
      internal-proxies: '127\.\d{1,3}\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1|f[cd][0-9a-f]{2}(:[0-9a-f]{1,4}){7}'
  servlet:
    session:
      timeout: 8h

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,refresh
  endpoint:
    health:
      # /livez and /readyz on the main port, for a load balancer or orchestrator (ADR-0152).
      # Readiness adds the replica contributor: ready only once the plugin boot has finished and the
      # bus listens, and not while draining. Neither probe depends on a broker.
      probes:
        enabled: true
        add-additional-paths: true
      show-details: when-authorized
      # Rahdar's own machinery (operational-health spec): jobs, broker calls and
      # notification subscriptions. DEGRADED sits between DOWN and UP and answers 200,
      # and the rahdar group is not part of liveness or readiness, so a broker outage
      # or a stalled job never gets Rahdar restarted or taken out of rotation.
      status:
        order: down,out-of-service,degraded,unknown,up
        http-mapping:
          down: 503
          out-of-service: 503
      group:
        readiness:
          include: readinessState,replica
        rahdar:
          include: jobs,partitions,brokers,subscriptions,permissions,pluginTrust,pluginLicenses,pluginSignIn,database
          show-details: when-authorized
  info:
    build:
      enabled: true
  metrics:
    distribution:
      # The 95th percentile of management call latency per node, for the health view and the alert rules.
      percentiles:
        rahdar.broker.management: 0.95

  # OTLP export of metrics, traces and logs (ADR-0147). Off by default: Rahdar sends nothing until the
  # standard OpenTelemetry variables switch it on, which Boot maps onto the properties below
  # (OpenTelemetryEnvironmentVariableEnvironmentPostProcessor): OTEL_EXPORTER_OTLP_ENDPOINT for the collector,
  # and OTEL_TRACES_EXPORTER, OTEL_METRICS_EXPORTER and OTEL_LOGS_EXPORTER set to otlp for the three signals,
  # plus OTEL_EXPORTER_OTLP_HEADERS, OTEL_TRACES_SAMPLER and the rest. Tracing itself stays on, so trace ids
  # reach the log lines either way.
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false
    # A low-traffic admin tool: keep every trace, so the one slow request is there to find.
    sampling:
      probability: 1.0

# Application configuration, bound by RahdarProperties.
#
# These are DEFAULTS. Most of this tree is overridable at runtime from Settings
# (a rahdar_setting row wins over the value here, and deleting the row restores
# it) — SettingsService.REGISTRY is the list of exactly which keys, and is the
# one place to add another. Nothing here is seeded into the database on first
# start, on purpose: an absent row means "use the packaged default", so an
# upgrade ships a new default instead of being pinned by a row written once.
rahdar:
  # The env key provider (ADR-0132): base64 of 32 bytes (version 1), or `1=<b64>,2=<b64>`
  # for key rotation. Protects every stored secret. The app fails to start if this is
  # missing or the wrong length. Other providers: rahdar.secrets.provider.
  secret-key: ${RAHDAR_SECRET_KEY:}
  # The address people open Rahdar at, e.g. https://rahdar.example.com. Alert notifications link back
  # to it, and it is the relying party of passkeys (ADR-0143): with it blank passkeys are unavailable,
  # and changing its host strands the passkeys enrolled under the old one. Blank: not set.
  public-url: ${RAHDAR_PUBLIC_URL:}
  # Several Rahdar replicas on one database (ADR-0152). A replica records a heartbeat from database
  # time; one whose heartbeat is older than ttl is gone. Keep ttl above two heartbeats.
  ha:
    heartbeat: 5s
    ttl: 15s
    # A stopping replica reports not ready and keeps serving this long before it closes streams,
    # so the load balancer has stopped routing to it. Longer than its detection time.
    drain-delay: 5s
    # A stopping replica waits this long for its bulk runs and transfers to finish, then stops them
    # and records them as interrupted with their progress.
    run-grace: 20s
  scrape:
    # Tiered polling cadence (ADR-0015).
    tier-a-interval: 5s      # HA state + topology + split-brain corroboration
    tier-b-interval: 15s     # re-read the queues that were busy last sweep
    tier-c-interval: 5m      # walk the whole queue set each tick
    discovery-interval: 1m   # re-read topology so a broker that joins appears (ADR-0119)
  rate-limit:
    # Per broker node. Conservative default so Rahdar never becomes the load.
    # Enforced by NodeCallLimiter (a per-node permit bucket refilled each second).
    management-calls-per-second: 20
  broker:
    # Connect and response timeouts of every broker call; Settings changes them live (ADR-0010).
    connect-timeout: 3s
    read-timeout: 10s
    clock-skew-tolerance-ms: 2000  # a broker clock further off than this is called skew (ADR-0053)
  mcp:
    # Result caps for the MCP surface (ADR-0045); tighter than REST's on purpose.
    # A mutation ceiling is NOT set here — that inherits safety.bulk-cap below.
    default-limit: 25
    max-limit: 100
  safety:
    # Server-enforced ceiling on one destructive message operation (ADR-0022).
    # A dry-run count above this is a 422 unless ?override=true (behind the UI's
    # typed confirmation).
    bulk-cap: 1000
    # Most queues one bulk run may act on (ADR-0093). No override.
    bulk-subscription-cap: 200
  transfer:
    # Cross-broker message transfer (ADR-0097), all overridable at runtime in Settings.
    # A move parks at most 2 x batch-size messages in its staging queue at any moment.
    batch-size: 200
    messages-per-second: 1000
    max-concurrent-runs: 4
    # A run waits when the target address or disk is this full, and stops after capacity-wait.
    capacity-threshold-percent: 90
    capacity-wait: 10m
  events:
    # Broker-event history (ADR-0028). coalesce-window-millis is the only
    # compile-time value here — TopicCoalescer reads it once at construction.
    buffer-size: 10000        # bounded write buffer; overflow is dropped and counted
    flush: 1s                 # BrokerEventWriter batch-insert interval
    coalesce-window-millis: 1000  # derived resource-view SSE signal coalescing (slice 3)
  rr:
    # Request-reply tracing (Phase 5). percentile-window is the only compile-time
    # value here: it is a Micrometer distributionStatisticExpiry fixed when the
    # Timer is registered, so a later change would silently not apply.
    default-deadline-ms: 30000     # used only when neither the message nor its expectation carries a deadline
    sweep-interval: 5s             # RrDeadlineSweep cadence
    sample-interval: 5s            # RrSampler cadence
    percentile-window: 15m         # Micrometer Timer distributionStatisticExpiry
    payload-capture-bytes: 4096    # captured request/reply body cap when an expectation enables capture
  flow:
    # Client-activity sampling for the flow view (ADR-0081). Runs only while a cluster's
    # flow is observed; one listProducers + listConsumers POST per serving node per sweep.
    sample-interval: 15s           # ClientSampler cadence, floored at 10s
    max-rows-per-node: 5000        # page size of each listing; the view states when a node has more
    demand-lease: 60s              # sampling continues this long after the last flow view closes
  alerting:
    # Notification delivery (Phase 7, ADR-0036). A separate RestClient from the
    # broker one — never shares the per-node rate limiter or a broker TLS bundle.
    dispatch-interval: 5s        # AlertDispatcher claim cadence
    max-attempts: 5              # a delivery goes DEAD after this many failures
    connect-timeout: 10s         # notificationRestClient connect + read timeout
    initial-backoff: 5s          # first retry delay (exponential with jitter)
    max-backoff: 10m             # backoff ceiling
    email-timeout: 15s           # SMTP connect + read + write timeout, per delivery
  setup-review:
    # HA, clustering and durability configuration review (ADR-0106): one batched read per node.
    interval: 15m                # how often every cluster is reviewed
    min-interval: 30s            # least spacing between two reviews of one cluster
  sse:
    # Keep-alive comment interval for GET /api/v1/stream (ADR-0018). Lower it if a
    # proxy in front of Rahdar idles the connection out sooner than this.
    heartbeat-interval: 20s
  broker-config:
    # Declared broker configuration (ADR-0067). The drift pass compares every live
    # node against its cluster's declaration — one batched read per node — and never
    # applies anything. The step cap bounds how many management writes one apply may
    # issue without an explicit override.
    drift-interval: 5m
    apply-step-cap: 100
  identity-local:
    # Local sign-in (ADR-0144). The minimum length is overridable at runtime in Settings.
    password-min-length: 12
  security:
    # Governance (Phase 8, ADR-0037, ADR-0040).
    oidc-claim: groups            # the token/userinfo claim holding the user's groups; mappings are set per provider in Administration

logging:
  # %wEx is Boot's own word and cannot be overridden; this one is masked (RedactingLogging, ADR-0133).
  exception-conversion-word: "%redactedEx"
  structured:
    json:
      customizer: io.github.sudoitir.rahdar.kernel.core.internal.RedactingJsonMembers
  level:
    io.github.sudoitir.rahdar: INFO
