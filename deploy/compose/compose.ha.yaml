# Rahdar — high-availability reference stack.
#
#   docker compose -f deploy/compose/compose.ha.yaml --env-file .env up -d
#
# Two Rahdar replicas behind HAProxy, on one Postgres. The replicas are stateless: sessions,
# settings and cluster ownership live in the database, and stream events reach every
# replica through it, so the load balancer needs no sticky sessions. Each registered cluster
# is polled by one replica at a time (site/src/guide/high-availability.md).
#
# Uses the same .env as compose.prod.yaml (deploy/compose/.env.example). Postgres here is a
# single container: its availability is yours to provide (managed Postgres, Patroni, ...).

name: rahdar-ha

x-rahdar: &rahdar
  # :dev is the moving build from main. :latest and :stable name the current
  # stable release. Pin a CalVer tag when the install must not move.
  image: ${RAHDAR_IMAGE:-sudoit1/rahdar:dev}
  environment:
    RAHDAR_DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
    RAHDAR_DB_USER: ${DB_USER}
    RAHDAR_DB_PASSWORD: ${DB_PASSWORD}
    RAHDAR_SECRET_KEY: ${SECRET_KEY:?}
    RAHDAR_CAPTURE_BROKER_ROLE: ${CAPTURE_BROKER_ROLE:-}
    # A plugin that needs a restart restarts its replica; `restart: unless-stopped` starts it again.
    RAHDAR_PLUGINS_RESTART_SUPERVISED: "true"
    # Pin plugin publishers' keys here instead of in the UI (ADR-0166; site/src/guide/plugins.md).
    # Each key needs a name and a PEM certificate or public key; the number is the item's index.
    # RAHDAR_PLUGINS_TRUSTED_KEYS_0_NAME: Example Publisher
    # RAHDAR_PLUGINS_TRUSTED_KEYS_0_PEM: ${PUBLISHER_KEY_PEM:?}
    JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=50 -XX:MaxMetaspaceSize=384m}
    # The standard OpenTelemetry variables from .env (.env.example): empty ones stay unset, so nothing is
    # exported until OTEL_EXPORTER_OTLP_ENDPOINT and a signal's exporter are set (site/src/guide/observability.md).
    OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-}
    OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
    OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-}
    OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
    OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
    OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
    OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-}
    OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-}
    OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
    OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-}
    OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-}
  restart: unless-stopped
  # Shutdown drains: readiness fails, cluster ownership moves, streams are told to reconnect,
  # and running bulk operations get 20 s to finish. Keep this above 45 s.
  stop_grace_period: 60s
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:8080/readyz || exit 1"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 120s
  deploy:
    resources:
      limits:
        memory: 2g

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:?}
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    # Each replica holds its pool plus one listening connection; max_connections is in the shared
    # server configuration (deploy/postgres/postgresql.conf, ADR-0195).
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - ../postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../postgres/10-pg-stat-statements.sql:/docker-entrypoint-initdb.d/10-pg-stat-statements.sql:ro
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 20

  rahdar-1:
    <<: *rahdar
    depends_on:
      postgres:
        condition: service_healthy

  # Starts once rahdar-1 is ready, so schema migrations run once.
  rahdar-2:
    <<: *rahdar
    depends_on:
      rahdar-1:
        condition: service_healthy

  lb:
    image: haproxy:3.2-alpine
    volumes:
      - ./ha/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "${RAHDAR_BIND:-127.0.0.1:8080}:8080"
    depends_on:
      rahdar-1:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
