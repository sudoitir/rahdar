# Rahdar — DEMO overlay on top of the dev stack.
#
#   docker compose -f deploy/compose/dev/compose.dev.yaml \
#                  -f deploy/compose/dev/compose.demo.yaml up -d      (or: just demo)
#
# Adds a second and a third live/backup replication pair, so every cross-node view
# has six nodes rather than two — which is the difference between a screenshot that
# shows the product and one that shows a laptop. Three pairs, not two: quorum voting
# needs at least three primaries to keep a majority when one pair is lost.
# `just demo` then drives real traffic through it with the broker image's own
# client; nothing writes to `metric_sample` directly, because a chart of invented samples is worth less than no chart.
#
# It also adds a three-broker Apache Kafka cluster (KRaft, every node a broker and a controller, share
# groups on), kafka-1 to kafka-3, which `just demo` registers as the cluster "events". The dev stack's
# single `kafka` node is switched off here by a profile, so only one Kafka cluster runs.
#
# Not hardened, not for anywhere public.

name: rahdar-dev

x-kafka-environment: &kafka-environment
  CLUSTER_ID: "rahdar-demo-kafka-001"
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "2"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  # The coordinator aborts a transaction that outlives its timeout within seconds. A day keeps the seed's
  # hanging transaction hanging, so the screens that show and abort one have something to act on.
  KAFKA_TRANSACTION_ABORT_TIMED_OUT_TRANSACTION_CLEANUP_INTERVAL_MS: "86400000"
  KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
  KAFKA_SUPER_USERS: User:ANONYMOUS
  # Three of them, six Artemis nodes, Rahdar and Postgres must fit in a laptop's Docker VM together.
  KAFKA_HEAP_OPTS: -Xms128m -Xmx384m

x-kafka-healthcheck: &kafka-healthcheck
  test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
  interval: 10s
  timeout: 10s
  retries: 12

services:
  # The dev stack's one-node Kafka gives way to the three below.
  kafka:
    profiles: ["single-kafka"]

  kafka-1:
    image: apache/kafka:4.4.0
    hostname: kafka-1
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:9094
    ports:
      - "9094:9094"
    healthcheck: *kafka-healthcheck

  kafka-2:
    image: apache/kafka:4.4.0
    hostname: kafka-2
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:9095
    ports:
      - "9095:9094"
    healthcheck: *kafka-healthcheck

  kafka-3:
    image: apache/kafka:4.4.0
    hostname: kafka-3
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:9096
    ports:
      - "9096:9094"
    healthcheck: *kafka-healthcheck

  artemis-secondary:
    image: apache/artemis:2.57.0
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      ANONYMOUS_LOGIN: "false"
      # The image's default heap is 2 GB per broker; several of them, Rahdar and Postgres must fit
      # in a laptop's Docker VM (Docker Desktop's is often 4 to 8 GB), or its OOM killer ends one.
      JAVA_ARGS_APPEND: "-Xms64m -Xmx512m"
    ports:
      - "8361:8161"
      - "61618:61616"
    volumes:
      - ./artemis/secondary/broker.xml:/var/lib/artemis-instance/etc-override/broker.xml:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8161 && printf 'GET /console/jolokia/read/org.apache.activemq.artemis:broker=%%22secondary%%22/Started HTTP/1.0\\r\\nAuthorization: Basic %s\\r\\n\\r\\n' \"$$(printf artemis:artemis | base64)\" >&3 && grep -q '\"value\":true' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12

  artemis-secondary-backup:
    image: apache/artemis:2.57.0
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      ANONYMOUS_LOGIN: "false"
      # The image's default heap is 2 GB per broker; several of them, Rahdar and Postgres must fit
      # in a laptop's Docker VM (Docker Desktop's is often 4 to 8 GB), or its OOM killer ends one.
      JAVA_ARGS_APPEND: "-Xms64m -Xmx512m"
    ports:
      - "8461:8161"
      - "61619:61616"
    volumes:
      - ./artemis/secondary-backup/broker.xml:/var/lib/artemis-instance/etc-override/broker.xml:ro
    depends_on:
      artemis-secondary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8161 && printf 'GET /console/jolokia/read/org.apache.activemq.artemis:broker=%%22secondary-backup%%22/Started HTTP/1.0\\r\\nAuthorization: Basic %s\\r\\n\\r\\n' \"$$(printf artemis:artemis | base64)\" >&3 && grep -q '\"value\":true' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12

  artemis-tertiary:
    image: apache/artemis:2.57.0
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      ANONYMOUS_LOGIN: "false"
      # The image's default heap is 2 GB per broker; several of them, Rahdar and Postgres must fit
      # in a laptop's Docker VM (Docker Desktop's is often 4 to 8 GB), or its OOM killer ends one.
      JAVA_ARGS_APPEND: "-Xms64m -Xmx512m"
    ports:
      - "8561:8161"
      - "61620:61616"
    volumes:
      - ./artemis/tertiary/broker.xml:/var/lib/artemis-instance/etc-override/broker.xml:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8161 && printf 'GET /console/jolokia/read/org.apache.activemq.artemis:broker=%%22tertiary%%22/Started HTTP/1.0\\r\\nAuthorization: Basic %s\\r\\n\\r\\n' \"$$(printf artemis:artemis | base64)\" >&3 && grep -q '\"value\":true' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12

  artemis-tertiary-backup:
    image: apache/artemis:2.57.0
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      ANONYMOUS_LOGIN: "false"
      # The image's default heap is 2 GB per broker; several of them, Rahdar and Postgres must fit
      # in a laptop's Docker VM (Docker Desktop's is often 4 to 8 GB), or its OOM killer ends one.
      JAVA_ARGS_APPEND: "-Xms64m -Xmx512m"
    ports:
      - "8661:8161"
      - "61621:61616"
    volumes:
      - ./artemis/tertiary-backup/broker.xml:/var/lib/artemis-instance/etc-override/broker.xml:ro
    depends_on:
      artemis-tertiary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8161 && printf 'GET /console/jolokia/read/org.apache.activemq.artemis:broker=%%22tertiary-backup%%22/Started HTTP/1.0\\r\\nAuthorization: Basic %s\\r\\n\\r\\n' \"$$(printf artemis:artemis | base64)\" >&3 && grep -q '\"value\":true' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
