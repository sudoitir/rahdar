# Rahdar — ISOLATED overlay for the demo estate's extra brokers.
#
#   docker compose -p rahdar-qa-<name> \
#                  -f deploy/compose/dev/compose.dev.yaml \
#                  -f deploy/compose/dev/compose.demo.yaml \
#                  -f deploy/compose/dev/compose.isolated.yaml \
#                  -f deploy/compose/dev/compose.isolated-demo.yaml up -d
#
# compose.isolated.yaml cannot name these services itself: an override that mentions a service
# the base files do not define is invalid, and the demo files are optional. Random loopback host
# ports, as in compose.isolated.yaml.

services:
  artemis-secondary:
    ports: !override
      - "127.0.0.1::8161"
      - "127.0.0.1::61616"

  artemis-secondary-backup:
    ports: !override
      - "127.0.0.1::8161"
      - "127.0.0.1::61616"

  artemis-tertiary:
    ports: !override
      - "127.0.0.1::8161"
      - "127.0.0.1::61616"

  artemis-tertiary-backup:
    ports: !override
      - "127.0.0.1::8161"
      - "127.0.0.1::61616"

  kafka-1:
    ports: !reset []
    # QA only: a simulated stuck coordinator. The coordinator aborts a transaction that outlives its timeout within
    # seconds; a day here keeps the seed's transaction hanging, so the sweep has one to show and abort. A demo does not
    # do this: it shows what Kafka does.
    environment:
      KAFKA_TRANSACTION_ABORT_TIMED_OUT_TRANSACTION_CLEANUP_INTERVAL_MS: "86400000"

  kafka-2:
    ports: !reset []
    # QA only: a simulated stuck coordinator. The coordinator aborts a transaction that outlives its timeout within
    # seconds; a day here keeps the seed's transaction hanging, so the sweep has one to show and abort. A demo does not
    # do this: it shows what Kafka does.
    environment:
      KAFKA_TRANSACTION_ABORT_TIMED_OUT_TRANSACTION_CLEANUP_INTERVAL_MS: "86400000"

  kafka-3:
    ports: !reset []
    # QA only: a simulated stuck coordinator. The coordinator aborts a transaction that outlives its timeout within
    # seconds; a day here keeps the seed's transaction hanging, so the sweep has one to show and abort. A demo does not
    # do this: it shows what Kafka does.
    environment:
      KAFKA_TRANSACTION_ABORT_TIMED_OUT_TRANSACTION_CLEANUP_INTERVAL_MS: "86400000"
