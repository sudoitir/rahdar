# Rahdar — DEV stack.
#
#   docker compose -f deploy/compose/dev/compose.dev.yaml up      (or: just dev-up)
#
# Brings up everything you need to see the product against a real cluster:
# Postgres, an Artemis primary/backup replication pair, a single-node Apache Kafka
# (KRaft, share groups on), and Rahdar pointed at them. Nothing here is hardened — plaintext credentials, no TLS,
# ports published to localhost. Do not run this anywhere public.

name: rahdar-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: rahdar
      POSTGRES_USER: rahdar
      POSTGRES_PASSWORD: rahdar
    # The same server configuration as the production stacks (ADR-0195).
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ../../postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../../postgres/10-pg-stat-statements.sql:/docker-entrypoint-initdb.d/10-pg-stat-statements.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rahdar -d rahdar"]
      interval: 5s
      timeout: 5s
      retries: 20

  artemis-primary:
    image: apache/artemis:2.57.0
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      # The mounted broker.xml is a COMPLETE config — docker-run.sh copies it over
      # the generated one, it does not merge. EXTRA_ARGS only affects the initial
      # `artemis create`, whose output the copy then replaces.
      ANONYMOUS_LOGIN: "false"
      # The image's default heap is 2 GB per broker; several of them, Rahdar and Postgres must fit
      # in a laptop's Docker VM (Docker Desktop's is often 4 to 8 GB), or its OOM killer ends one.
      JAVA_ARGS_APPEND: "-Xms64m -Xmx512m"
    ports:
      - "8161:8161"     # web console + Jolokia
      - "61616:61616"   # Core / AMQP / OpenWire
    volumes:
      - ./artemis/primary/broker.xml:/var/lib/artemis-instance/etc-override/broker.xml:ro
    healthcheck:
      # Started, not Active: a running node is Started even before it wins primary.
      # The image has no curl or wget, so bash speaks HTTP itself, with the Basic credentials artemis:artemis.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8161 && printf 'GET /console/jolokia/read/org.apache.activemq.artemis:broker=%%22primary%%22/Started HTTP/1.0\\r\\nAuthorization: Basic %s\\r\\n\\r\\n' \"$$(printf artemis:artemis | base64)\" >&3 && grep -q '\"value\":true' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12

  artemis-backup:
    image: apache/artemis:2.57.0
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      ANONYMOUS_LOGIN: "false"
      # The image's default heap is 2 GB per broker; several of them, Rahdar and Postgres must fit
      # in a laptop's Docker VM (Docker Desktop's is often 4 to 8 GB), or its OOM killer ends one.
      JAVA_ARGS_APPEND: "-Xms64m -Xmx512m"
    ports:
      - "8261:8161"
      - "61617:61616"
    volumes:
      - ./artemis/backup/broker.xml:/var/lib/artemis-instance/etc-override/broker.xml:ro
    depends_on:
      artemis-primary:
        condition: service_healthy
    healthcheck:
      # A healthy backup is Started=true and Active=false. Don't gate on Active.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8161 && printf 'GET /console/jolokia/read/org.apache.activemq.artemis:broker=%%22backup%%22/Started HTTP/1.0\\r\\nAuthorization: Basic %s\\r\\n\\r\\n' \"$$(printf artemis:artemis | base64)\" >&3 && grep -q '\"value\":true' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One Apache Kafka node that is its own controller (KRaft). Register it in Rahdar as Apache Kafka with the
  # bootstrap server kafka:9092; a tool on the host reaches it at localhost:9094. The StandardAuthorizer is on
  # with the anonymous user a plaintext client arrives as a super user, so the ACLs page has an authoriser to
  # read and nothing is refused. Share groups are a feature the cluster has to finalise (see
  # scripts/demo-seed.sh): `kafka-features.sh --bootstrap-server kafka:9092 upgrade --feature share.version=2`.
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    # The demo's brokers are kafka-1 to kafka-3; the sweep's scenes name kafka-1 on either stack.
    networks:
      default:
        aliases:
          - kafka-1
    environment:
      CLUSTER_ID: "rahdar-dev-kafka-0001a"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:ANONYMOUS
      # Several brokers, Rahdar and Postgres must fit in a laptop's Docker VM together.
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  rahdar:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      RAHDAR_DB_URL: jdbc:postgresql://postgres:5432/rahdar
      RAHDAR_DB_USER: rahdar
      RAHDAR_DB_PASSWORD: rahdar
      # Protects every stored secret (ADR-0132). Base64 of exactly 32 bytes (one
      # key, version 1) or `1=<b64>,2=<b64>` (several versions, for key rotation);
      # the app refuses to start otherwise. DEV ONLY — for prod run
      # `openssl rand -base64 32` and keep it out of source control.
      RAHDAR_SECRET_KEY: "YXJ0ZW1pcy1zdHVkaW8tZGV2LWluc2VjdXJlLWtleS0="
      # The dev brokers' users hold only the default `amq` role. Rahdar warns about it;
      # a real deployment gives Rahdar's broker user a dedicated role.
      RAHDAR_CAPTURE_BROKER_ROLE: amq
      # A plugin that needs a restart restarts Rahdar itself; `restart: unless-stopped` below
      # is what starts it again. Remove both together, never one (ADR-0104).
      RAHDAR_PLUGINS_RESTART_SUPERVISED: "true"
      # A fixed heap, so Rahdar, the brokers and Postgres fit in a laptop's Docker VM together.
      JAVA_OPTS: -Xmx1536m -XX:MaxMetaspaceSize=384m
    ports:
      # Loopback only: the API is unauthenticated until Phase 8 (ADR-0002 area).
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
